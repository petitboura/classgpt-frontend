<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Dégradé resserré (12/08, demande Bourama) vers les tons réels de
         l'ancien logo Djiguignè (échantillonnés depuis logo.png) : plus
         sombre et plus saturé que l'ancien dj-gradient pastel. -->
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F0C766"/>
      <stop offset="55%" stop-color="#D9A438"/>
      <stop offset="100%" stop-color="#8A6A1F"/>
    </linearGradient>
  </defs>
  <!-- Plume : vanne asymétrique (bord droit plus bombé que le bord gauche),
       hampe qui ne suit pas exactement le milieu de la vanne, barbes de
       longueurs et d'écartements volontairement inégaux, traitement "à
       main levée", même logique que l'ancien logo (cf. brief section 4b),
       jamais de courbe parfaitement symétrique. -->
  <path d="M45.5 7.5
           C53.5 12.5, 56.5 24, 50.5 34.5
           C45.5 43.5, 35 49.5, 23.5 53.5
           C24.7 46, 29.5 39, 33.5 30.5
           C38 21, 42 14, 45.5 7.5 Z"
        fill="url(#grad)"/>
  <path d="M45.5 7.5
           C53.5 12.5, 56.5 24, 50.5 34.5
           C45.5 43.5, 35 49.5, 23.5 53.5
           C24.7 46, 29.5 39, 33.5 30.5
           C38 21, 42 14, 45.5 7.5 Z"
        fill="none" stroke="#1a0f06" stroke-opacity=".18" stroke-width="1"/>

  <!-- hampe centrale, prolongée en calamus sous la vanne -->
  <path d="M44.5 9.5 C39 19, 31.5 33, 25 44.5 C21.8 48.5, 17.5 53, 13.5 56.5"
        fill="none" stroke="url(#grad)" stroke-width="2.6" stroke-linecap="round"/>
  <circle cx="12.3" cy="57.7" r="2.4" fill="url(#grad)"/>

  <!-- barbes, longueurs/angles inégaux, jamais deux identiques -->
  <path d="M41 15 L49.5 12.5" stroke="url(#grad)" stroke-width="1.6" stroke-linecap="round" opacity=".85"/>
  <path d="M37.7 21.5 L48 18" stroke="url(#grad)" stroke-width="1.6" stroke-linecap="round" opacity=".85"/>
  <path d="M34.2 28.7 L46.3 24.3" stroke="url(#grad)" stroke-width="1.6" stroke-linecap="round" opacity=".8"/>
  <path d="M30.6 35.8 L43.6 30.5" stroke="url(#grad)" stroke-width="1.5" stroke-linecap="round" opacity=".75"/>
  <path d="M26.5 42.3 L39.3 36.6" stroke="url(#grad)" stroke-width="1.4" stroke-linecap="round" opacity=".7"/>
  <path d="M22 48.6 L33.4 43" stroke="url(#grad)" stroke-width="1.3" stroke-linecap="round" opacity=".65"/>
</svg>
